services:
  dac:
    build: .
    container_name: dollar-ads-club
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./dados:/data          # dac.sqlite3, fotos/, avisos.log  -> fazer backup diário
    ports:
      - "127.0.0.1:8001:8000"  # só local; o cloudflared publica dac-origem.loudhouse.com.br -> http://localhost:8001
