<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dollar Ads Club</title><link rel="icon" href="icone.png">
<style>
:root{--bg:#f4f6f3;--card:#fff;--fg:#18211b;--mut:#5f6d63;--line:#d8dfd7;--acc:#1f7a4d;--acc2:#e8f3ec;--err:#b3261e;--warn:#a85d12}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:1.05rem;margin:0}header .sp{flex:1}
nav{display:flex;gap:4px;flex-wrap:wrap}nav button{background:none;border:0;padding:8px 12px;border-radius:6px;cursor:pointer;font:inherit;color:var(--mut)}
nav button[aria-selected=true]{background:var(--acc2);color:var(--acc);font-weight:600}
main{max-width:1100px;margin:0 auto;padding:20px 16px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
h2{font-size:1.1rem;margin:0 0 12px}h3{font-size:1rem;margin:0 0 8px}
.btn{background:var(--acc);color:#fff;border:0;border-radius:7px;padding:9px 14px;font:inherit;font-weight:600;cursor:pointer}
.btn.sec{background:var(--card);color:var(--fg);border:1px solid var(--line)}.btn.sm{padding:5px 10px;font-size:.85rem}.btn:disabled{opacity:.5;cursor:default}
input,textarea,select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:7px;font:inherit;background:var(--card);color:var(--fg)}
textarea{min-height:120px}label{display:block;font-size:.85rem;color:var(--mut);margin:10px 0 4px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.prod img{width:100%;aspect-ratio:1;object-fit:contain;background:#fff;border-radius:8px;border:1px solid var(--line)}
.prod .t{font-weight:600;margin:8px 0 2px}.mut{color:var(--mut);font-size:.88rem}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:.78rem;font-weight:600;background:var(--acc2);color:var(--acc)}
.pill.off{background:#eee;color:#666}.pill.err{background:#fde8e6;color:var(--err)}.pill.warn{background:#fdf0e2;color:var(--warn)}
table{width:100%;border-collapse:collapse;font-size:.9rem}td,th{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.tw{overflow-x:auto}.big{font-size:1.6rem;font-weight:700}
.fotos{display:flex;gap:8px;flex-wrap:wrap}.fotos div{position:relative;width:96px}.fotos img{width:96px;height:96px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:6px}
.fotos button{position:absolute;top:2px;right:2px;border:0;border-radius:4px;background:#000a;color:#fff;cursor:pointer}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#18211b;color:#fff;padding:10px 16px;border-radius:8px;opacity:0;transition:.2s;pointer-events:none;max-width:90vw}
#toast.on{opacity:1}#toast.err{background:var(--err)}
dialog{border:0;border-radius:12px;max-width:640px;width:calc(100% - 32px);padding:20px}dialog::backdrop{background:#0006}
.auth{max-width:420px;margin:40px auto}.seg{display:flex;gap:6px}.seg button{flex:1}
a{color:var(--acc)}
</style></head><body>
<header><h1>Dollar Ads Club</h1><nav id="nav"></nav><span class="sp"></span><span id="quem" class="mut"></span></header>
<main id="main"></main>
<dialog id="dlg"></dialog><div id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const brl=v=>(+v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const cent=c=>brl((c||0)/100);
const data=t=>t?new Date(t*1000).toLocaleString("pt-BR",{dateStyle:"short",timeStyle:"short"}):"";
function toast(t,err){const e=$("#toast");e.textContent=t;e.className=err?"on err":"on";clearTimeout(e._t);e._t=setTimeout(()=>e.className="",3500)}
async function api(u,o={}){const r=await fetch(u,{...o,headers:{"content-type":"application/json","x-dac":"1"},body:o.body?JSON.stringify(o.body):undefined});
  let j;try{j=await r.json()}catch{j={}}if(!r.ok){const e=new Error(j.detail||"Algo deu errado. Tente de novo.");e.status=r.status;throw e}return j}
const STATUS={reservado:["Publicando","warn"],publicado:["Em análise no ML","warn"],ativo:["Ativo",""],falhou:["Falhou","err"],encerrado:["Encerrado","off"]};
const pill=s=>{const[t,c]=STATUS[s]||[s,"off"];return`<span class="pill ${c}">${t}</span>`};
let EU=null,aba=null;

/* ---------- entrar / cadastrar ---------- */
function telaAuth(modo="entrar"){
  $("#nav").innerHTML="";$("#quem").textContent="";
  $("#main").innerHTML=`<div class="card auth"><div class="seg"><button class="btn ${modo=="entrar"?"":"sec"}" id="a-e">Entrar</button><button class="btn ${modo=="cad"?"":"sec"}" id="a-c">Criar conta</button></div>
  <form id="f">${modo=="cad"?`<label>Eu sou</label><select id="papel"><option value="afiliado">Afiliado — confiro e envio anúncios e ganho por anúncio</option><option value="empresa">Empresa — cadastro produtos e compro créditos</option></select>
  <label for="nome">Seu nome</label><input id="nome" required><div id="emp-w" hidden><label for="empresa">Nome da empresa</label><input id="empresa"></div>`:""}
  <label for="email">E-mail</label><input id="email" type="email" autocomplete="email" required>
  <label for="senha">Senha</label><input id="senha" type="password" minlength="8" autocomplete="${modo=="cad"?"new-password":"current-password"}" required>
  ${modo=="cad"?`<label style="display:flex;gap:8px;align-items:flex-start;color:var(--fg)"><input type="checkbox" id="aceite" style="width:auto;margin-top:3px"> <span>Li e aceito os <a href="termos.html" target="_blank">Termos de Uso</a> e a <a href="privacidade.html" target="_blank">Política de Privacidade</a>.</span></label>`:""}
  <p><button class="btn" style="width:100%">${modo=="cad"?"Criar conta":"Entrar"}</button></p></form></div>`;
  $("#a-e").onclick=()=>telaAuth("entrar");$("#a-c").onclick=()=>telaAuth("cad");
  if(modo=="cad")$("#papel").onchange=e=>$("#emp-w").hidden=e.target.value!="empresa";
  $("#f").onsubmit=async e=>{e.preventDefault();try{
    if(modo=="cad")await api("api/cadastro",{method:"POST",body:{papel:$("#papel").value,nome:$("#nome").value,empresa:$("#empresa").value,email:$("#email").value,senha:$("#senha").value,aceite:$("#aceite").checked}});
    else await api("api/entrar",{method:"POST",body:{email:$("#email").value,senha:$("#senha").value}});
    iniciar()}catch(x){toast(x.message,1)}};
}
async function iniciar(){
  try{EU=await api("api/eu")}catch(e){return telaAuth()}
  const u=EU.usuario;$("#quem").innerHTML=`${esc(u.nome||u.email)} · <a href="#" id="sair">Sair</a>`;
  $("#sair").onclick=async e=>{e.preventDefault();await api("api/sair",{method:"POST"});telaAuth()};
  const ABAS={empresa:[["produtos","Produtos"],["contas","Contas do ML"],["creditos","Créditos"],["anuncios","Anúncios"],["conta","Minha conta"]],
    afiliado:[["disponiveis","Para anunciar"],["meus","Meus anúncios"],["saldo","Saldo"],["conta","Minha conta"]],
    admin:[["admin","Painel"],["conta","Minha conta"]]}[u.papel];
  $("#nav").innerHTML=ABAS.map(([k,t])=>`<button data-a="${k}">${t}</button>`).join("");
  $("#nav").onclick=e=>{const b=e.target.closest("button");if(b){location.hash=b.dataset.a}};
  const ir=()=>{const h=location.hash.slice(1);aba=ABAS.some(a=>a[0]==h)?h:ABAS[0][0];
    document.querySelectorAll("#nav button").forEach(b=>b.setAttribute("aria-selected",b.dataset.a==aba));TELAS[aba]()};
  window.onhashchange=ir;ir();
}

/* ---------- empresa ---------- */
let EMP=null;
async function carregaEmp(){EMP=await api("api/empresa");return EMP}
const TELAS={};
TELAS.produtos=async()=>{const d=await carregaEmp();const sem=!d.contas.some(c=>c.ativa);
  $("#main").innerHTML=`${sem?`<div class="card"><b>Conecte ao menos uma conta do Mercado Livre</b> para os afiliados poderem publicar. <a href="#contas">Conectar</a></div>`:""}
  ${d.empresa.creditos<1?`<div class="card"><b>Sem créditos.</b> Seus produtos ativos não aparecem para os afiliados até você <a href="#creditos">comprar créditos</a>.</div>`:""}
  <div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><h2 style="margin:0">Produtos</h2><button class="btn" id="novo">Novo produto</button></div></div>
  <div class="grid">${d.produtos.map(p=>`<div class="card prod"><img alt="" src="${p.fotos[0]?"api/foto/"+p.fotos[0]:""}"><div class="t">${esc(p.titulo)}</div>
   <div class="mut">${brl(p.preco)} · estoque ${p.estoque} · ${p.anuncios_ativos} anúncio(s) ativo(s) · ${p.contas_livres} conta(s) livre(s)</div>
   <p style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">${p.ativo?'<span class="pill">Ativo para afiliados</span>':'<span class="pill off">Pausado</span>'}
   <button class="btn sm sec" data-at="${p.id}" data-v="${p.ativo?0:1}">${p.ativo?"Pausar":"Ativar"}</button><button class="btn sm sec" data-ed="${p.id}">Editar</button></p></div>`).join("")||'<p class="mut">Nenhum produto ainda.</p>'}</div>`;
  $("#novo").onclick=()=>formProduto();
  $("#main").onclick=async e=>{const a=e.target.closest("[data-at]"),b=e.target.closest("[data-ed]");
    if(a){try{await api(`api/produtos/${a.dataset.at}/ativo`,{method:"POST",body:{ativo:a.dataset.v=="1"}});TELAS.produtos()}catch(x){toast(x.message,1)}}
    if(b)formProduto(EMP.produtos.find(p=>p.id==b.dataset.ed))};
};
function formProduto(p={}){
  let fotos=(p.fotos||[]).slice();const ver=f=>f.startsWith("data:")?f:"api/foto/"+f;
  const d=$("#dlg");d.innerHTML=`<h2>${p.id?"Editar":"Novo"} produto</h2><form id="pf">
  <label>Fotos (a 1ª é a capa; o fundo fica branco automaticamente)</label><div class="fotos" id="fts"></div>
  <p><input type="file" id="fin" accept="image/*" multiple hidden><button type="button" class="btn sec sm" id="fadd">Adicionar fotos</button> <span id="fst" class="mut"></span></p>
  <label for="p-t">Título (até 60)</label><input id="p-t" maxlength="60" value="${esc(p.titulo)}" required>
  <div class="row"><div><label for="p-p">Preço (R$)</label><input id="p-p" inputmode="decimal" value="${p.preco??""}" required></div>
  <div><label for="p-e">Estoque</label><input id="p-e" inputmode="numeric" value="${p.estoque??""}" required></div>
  <div><label for="p-c">Condição</label><select id="p-c"><option value="new">Novo</option><option value="used" ${p.condicao=="used"?"selected":""}>Usado</option></select></div></div>
  <label for="p-cat">Categoria do ML</label><div style="display:flex;gap:6px"><input id="p-cat" value="${esc(p.categoria_id)}" placeholder="ex.: MLB1234"><button type="button" class="btn sec sm" id="sug">Sugerir</button></div><div id="cats" class="mut"></div>
  <div class="row"><div><label for="p-m">Marca</label><input id="p-m" value="${esc(p.marca)}"></div><div><label for="p-g">GTIN / código de barras</label><input id="p-g" inputmode="numeric" value="${esc(p.gtin)}"></div>
  <div><label for="p-s">Sem GTIN? motivo</label><select id="p-s"><option value="">—</option>${["O produto é uma peça artesanal","O produto é um kit","O produto não tem código cadastrado"].map(m=>`<option ${p.sem_gtin_motivo==m?"selected":""}>${m}</option>`).join("")}</select></div></div>
  <label for="p-d">Descrição</label><textarea id="p-d">${esc(p.descricao)}</textarea>
  <details><summary class="mut">Avançado: atributos extras do ML (JSON)</summary><textarea id="p-x" style="font-family:monospace;min-height:80px">${esc(JSON.stringify(p.extras||{},null,1))}</textarea></details>
  <p style="display:flex;gap:8px;justify-content:flex-end"><button type="button" class="btn sec" id="pc">Cancelar</button><button class="btn" id="ps">Salvar</button></p></form>`;
  const draw=()=>{$("#fts").innerHTML=fotos.map((f,i)=>`<div><img alt="Foto ${i+1}" src="${ver(f)}"><button type="button" data-rm="${i}" aria-label="Tirar foto">×</button></div>`).join("")};draw();
  $("#fts").onclick=e=>{const b=e.target.closest("[data-rm]");if(b){fotos.splice(+b.dataset.rm,1);draw()}};
  $("#fadd").onclick=()=>$("#fin").click();
  $("#fin").onchange=async e=>{const fs=[...e.target.files];e.target.value="";for(const[i,f]of fs.entries()){$("#fst").textContent=`Deixando fundo branco ${i+1}/${fs.length}…`;
    try{fotos.push(await fundoBranco(f));draw()}catch(x){toast("Foto "+(i+1)+": "+x.message,1)}}$("#fst").textContent=""};
  $("#sug").onclick=async()=>{const t=$("#p-t").value;if(!t)return toast("Escreva o título primeiro",1);
    try{const r=await api("api/empresa/categoria?termo="+encodeURIComponent(t));$("#cats").innerHTML=(r||[]).map(c=>`<a href="#" data-c="${esc(c.category_id)}">${esc(c.category_name)} (${esc(c.domain_name||"")})</a>`).join(" · ")||"Nada sugerido."}catch(x){toast(x.message,1)}};
  $("#cats").onclick=e=>{const a=e.target.closest("[data-c]");if(a){e.preventDefault();$("#p-cat").value=a.dataset.c}};
  $("#pc").onclick=()=>d.close();
  $("#pf").onsubmit=async e=>{e.preventDefault();let extras;try{extras=JSON.parse($("#p-x").value||"{}")}catch{return toast("O JSON dos atributos extras está inválido",1)}
    $("#ps").disabled=true;try{await api(p.id?`api/produtos/${p.id}`:"api/produtos",{method:p.id?"PUT":"POST",body:{titulo:$("#p-t").value,preco:$("#p-p").value.replace(",","."),estoque:$("#p-e").value,
      condicao:$("#p-c").value,categoria_id:$("#p-cat").value.trim(),marca:$("#p-m").value,gtin:$("#p-g").value.trim()||null,sem_gtin_motivo:$("#p-s").value||null,descricao:$("#p-d").value,extras,fotos}});
      d.close();toast("Produto salvo");TELAS.produtos()}catch(x){toast(x.message,1)}$("#ps").disabled=false};
  d.showModal();
}
TELAS.contas=async()=>{const d=await carregaEmp();
  $("#main").innerHTML=`<div class="card"><h2>Contas do Mercado Livre</h2><p class="mut">Cada anúncio vai para uma conta diferente: um produto aparece no máximo uma vez por conta (o ML não permite anúncios duplicados no mesmo vendedor). Você autoriza no próprio ML — nunca pedimos sua senha.</p>
  <p><button class="btn" id="con">Conectar conta do ML</button></p>
  <div class="tw"><table><tr><th>Conta</th><th>Situação</th><th></th></tr>${d.contas.map(c=>`<tr><td>${esc(c.apelido||c.ml_user_id)}</td><td>${c.ativa?'<span class="pill">Conectada</span>':'<span class="pill off">Desconectada</span>'}</td>
  <td>${c.ativa?`<button class="btn sm sec" data-rm="${c.id}">Desconectar</button>`:""}</td></tr>`).join("")||'<tr><td colspan="3" class="mut">Nenhuma conta.</td></tr>'}</table></div></div>`;
  $("#con").onclick=async()=>{try{location.href=(await api("api/empresa/ml/conectar")).url}catch(x){toast(x.message,1)}};
  $("#main").onclick=async e=>{const b=e.target.closest("[data-rm]");if(b){await api(`api/empresa/contas/${b.dataset.rm}/remover`,{method:"POST"});TELAS.contas()}};
};
TELAS.creditos=async()=>{const d=await carregaEmp(),pc=EU.config.preco_credito;
  $("#main").innerHTML=`<div class="card"><h2>Créditos</h2><div class="big">${d.empresa.creditos}</div><p class="mut">1 crédito = 1 anúncio publicado e ativo. Se a publicação falhar, o crédito volta.</p>
  <form id="cf" class="row" style="align-items:end"><div><label for="qtd">Quantidade</label><input id="qtd" type="number" min="1" value="50"></div><div class="mut" id="tot"></div><div><button class="btn" ${EU.config.mp?"":"disabled"}>Pagar com Mercado Pago</button></div></form>
  ${EU.config.mp?"":'<p class="mut">Pagamento ainda não configurado.</p>'}</div>
  <div class="card"><h3>Pagamentos</h3><div class="tw"><table><tr><th>Data</th><th>Créditos</th><th>Valor</th><th>Situação</th></tr>${d.pagamentos.map(p=>`<tr><td>${data(p.criado)}</td><td>${p.creditos}</td><td>${brl(p.valor)}</td><td>${p.status=="aprovado"?'<span class="pill">Aprovado</span>':'<span class="pill warn">Aguardando</span>'}</td></tr>`).join("")||'<tr><td colspan="4" class="mut">Nenhum.</td></tr>'}</table></div></div>`;
  const t=()=>$("#tot").textContent="Total: "+brl(($("#qtd").value||0)*pc);t();$("#qtd").oninput=t;
  $("#cf").onsubmit=async e=>{e.preventDefault();try{location.href=(await api("api/empresa/creditos/comprar",{method:"POST",body:{quantidade:+$("#qtd").value}})).url}catch(x){toast(x.message,1)}};
};
TELAS.anuncios=async()=>{const d=await carregaEmp();
  $("#main").innerHTML=`<div class="card"><h2>Anúncios publicados</h2><div class="tw"><table><tr><th>Data</th><th>Produto</th><th>Conta</th><th>Situação</th></tr>${d.anuncios.map(a=>`<tr><td>${data(a.criado)}</td><td>${a.link?`<a href="${esc(a.link)}" target="_blank" rel="noopener">${esc(a.titulo)}</a>`:esc(a.titulo)}${a.erro?`<div class="mut">${esc(a.erro).slice(0,200)}</div>`:""}</td><td>${esc(a.apelido)}</td><td>${pill(a.status)}</td></tr>`).join("")||'<tr><td colspan="4" class="mut">Nenhum.</td></tr>'}</table></div></div>`;
};

/* ---------- afiliado ---------- */
TELAS.disponiveis=async()=>{const d=await api("api/afiliado");
  $("#main").innerHTML=`<div class="card"><h2>Produtos para anunciar</h2><p class="mut">Confira os dados e envie. Você ganha ${cent(EU.config.ganho)} quando o anúncio fica ativo no Mercado Livre${EU.config.liberar_dias>0?` (liberado após ${EU.config.liberar_dias} dias)`:""}.</p></div>
  <div class="grid">${d.produtos.map(p=>`<div class="card prod"><img alt="" src="api/foto/${p.fotos[0]}"><div class="t">${esc(p.titulo)}</div><div class="mut">${esc(p.empresa)} · ${brl(p.preco)}</div><p><button class="btn" data-p="${p.id}">Conferir e enviar</button></p></div>`).join("")||'<p class="mut">Nenhum produto disponível agora. Volte mais tarde.</p>'}</div>`;
  $("#main").onclick=e=>{const b=e.target.closest("[data-p]");if(b)conferir(d.produtos.find(p=>p.id==b.dataset.p))};
};
function conferir(p){const d=$("#dlg");
  d.innerHTML=`<h2>Conferir anúncio</h2><div class="fotos">${p.fotos.map(f=>`<div><img alt="" src="api/foto/${f}"></div>`).join("")}</div>
  <p class="mut">${esc(p.empresa)} · ${brl(p.preco)} · estoque ${p.estoque} · ${p.condicao=="used"?"usado":"novo"}${p.marca?" · "+esc(p.marca):""}</p>
  <form id="cf"><label for="c-t">Título (até 60)</label><input id="c-t" maxlength="60" value="${esc(p.titulo)}">
  <label for="c-d">Descrição</label><textarea id="c-d">${esc(p.descricao)}</textarea>
  ${EU.config.ia?'<p><button type="button" class="btn sec sm" id="ia">Sugerir outras palavras (IA)</button></p>':""}
  <label style="display:flex;gap:8px;color:var(--fg)"><input type="checkbox" id="ok" style="width:auto"> Conferi: título, fotos e descrição correspondem ao produto.</label>
  <p style="display:flex;gap:8px;justify-content:flex-end"><button type="button" class="btn sec" id="cc">Cancelar</button><button class="btn" id="env">Enviar</button></p></form>`;
  $("#cc").onclick=()=>d.close();
  if($("#ia"))$("#ia").onclick=async e=>{e.target.disabled=true;try{const r=await api("api/ia/variar",{method:"POST",body:{produto_id:p.id}});$("#c-t").value=r.titulo;$("#c-d").value=r.descricao}catch(x){toast(x.message,1)}e.target.disabled=false};
  $("#cf").onsubmit=async e=>{e.preventDefault();if(!$("#ok").checked)return toast("Marque que conferiu os dados",1);$("#env").disabled=true;$("#env").textContent="Publicando…";
    try{const r=await api("api/afiliado/publicar",{method:"POST",body:{produto_id:p.id,titulo:$("#c-t").value,descricao:$("#c-d").value}});
      d.close();toast(r.status=="ativo"?"Publicado e ativo!":"Publicado; aguardando o ML aprovar");TELAS.disponiveis()}catch(x){toast(x.message,1);$("#env").disabled=false;$("#env").textContent="Enviar"}};
  d.showModal();
}
TELAS.meus=async()=>{const d=await api("api/afiliado");

/* ---------- fundo branco no navegador (modelo U²-Netp) ---------- */
let ortS=null,ortP=null;
function carregarModelo(){if(ortP)return ortP;ortP=(async()=>{
  if(!window.ort)await new Promise((ok,er)=>{const sc=document.createElement("script");sc.src="ort/ort.min.js";sc.onload=ok;sc.onerror=()=>er(new Error("não carregou o motor"));document.head.append(sc)});
  ort.env.wasm.wasmPaths=new URL("ort/",location.href).href;ort.env.wasm.numThreads=1;
  const buf=await (await fetch("modelo/u2netp.wasm")).arrayBuffer();
  ortS=await ort.InferenceSession.create(buf,{executionProviders:["wasm"]});return ortS})();ortP.catch(()=>{ortP=null});return ortP}
async function fundoBranco(file){
  const img=await new Promise((ok,er)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=er;i.src=URL.createObjectURL(file)});
  const S=320,c=document.createElement("canvas");c.width=c.height=S;const g=c.getContext("2d");g.drawImage(img,0,0,S,S);
  const px=g.getImageData(0,0,S,S).data;let mx=0;for(let i=0;i<px.length;i+=4)mx=Math.max(mx,px[i],px[i+1],px[i+2]);mx=mx||255;
  const M=[.485,.456,.406],D=[.229,.224,.225],t=new Float32Array(3*S*S);
  for(let i=0,j=0;i<px.length;i+=4,j++)for(let k=0;k<3;k++)t[k*S*S+j]=(px[i+k]/mx-M[k])/D[k];
  const s=await carregarModelo();const out=await s.run({[s.inputNames[0]]:new ort.Tensor("float32",t,[1,3,S,S])});
  const o=out[s.outputNames[0]].data;let lo=Infinity,hi=-Infinity;for(const v of o){if(v<lo)lo=v;if(v>hi)hi=v}
  const W=img.naturalWidth,H=img.naturalHeight,k0=Math.min(1,1600/Math.max(W,H)),w=Math.round(W*k0),h=Math.round(H*k0);
  const mk=document.createElement("canvas");mk.width=mk.height=S;const mg=mk.getContext("2d");const md=mg.createImageData(S,S);
  for(let j=0;j<S*S;j++){const a=Math.round((o[j]-lo)/(hi-lo||1)*255);md.data[j*4+3]=a}mg.putImageData(md,0,0);
  const cv=document.createElement("canvas");cv.width=w;cv.height=h;const cg=cv.getContext("2d");cg.drawImage(img,0,0,w,h);cg.globalCompositeOperation="destination-in";cg.drawImage(mk,0,0,w,h);
  const ad=cg.getImageData(0,0,w,h).data;let x0=w,y0=h,x1=0,y1=0;for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(ad[(y*w+x)*4+3]>30){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}
  if(x1<=x0||y1<=y0)throw new Error("não achei o produto na foto");
  const F=1200,bw=x1-x0+1,bh=y1-y0+1,k=F*.85/Math.max(bw,bh);const fc=document.createElement("canvas");fc.width=fc.height=F;const fg=fc.getContext("2d");
  fg.fillStyle="#fff";fg.fillRect(0,0,F,F);fg.drawImage(cv,x0,y0,bw,bh,(F-bw*k)/2,(F-bh*k)/2,bw*k,bh*k);
  return fc.toDataURL("image/jpeg",.9)}
iniciar();
